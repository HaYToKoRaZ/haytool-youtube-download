name: Release CI/CD

on:
  push:
    tags:
      - 'v*' # Sadece v ile başlayan etiketlerde çalışır (Örn: v9.8.4)

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create FFmpeg Directory
        run: New-Item -ItemType Directory -Force -Path ffmpeg

      - name: Download FFmpeg (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp
          Copy-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "ffmpeg\" -Force
          Copy-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" -Destination "ffmpeg\" -Force
          Remove-Item -Path ffmpeg.zip -Force
          Remove-Item -Path ffmpeg_temp -Recurse -Force

      - name: Create yt-dlp Directory
        run: New-Item -ItemType Directory -Force -Path yt-dlp

      - name: Download yt-dlp Nightly (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp\yt-dlp.exe"

      - name: Build Windows Portable ZIP
        run: |
          $tag = "${{ github.ref_name }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $ZipName = "$tag-HaYTooL-YD-Win-$date.zip"
          
          # '0nogithub' klasörü .gitignore içinde olduğu için GitHub'a gitmiyor.
          # Bu yüzden paketlemeyi yerel betik yerine burada 7-Zip ile yapıyoruz.
          $ExcludeArgs = @(
              "-xr!.git", "-xr!0nogithub", "-xr!scratch", "-xr!backup", "-xr!logs", 
              "-xr!screenshots", "-xr!releases", "-xr!*.WebView2", "-xr!EBWebView", 
              "-xr!.cache", "-xr!.vs", "-xr!.vscode",
              "-x!*.log", "-x!*.map", "-x!*.d.ts", "-x!*.pdb", "-x!*.tmp", "-x!*.bak", 
              "-x!*.exe.old", "-x!*.sh", "-x!Microsoft.Web.WebView2.*.xml", "-x!tray.cs",
              "-x!configwin.ini", "-x!configunix.ini", "-x!channels.ini", "-x!channels.json", 
              "-x!categories.ini", "-x!.gitignore", "-x!db.json", "-x!Desktop.ini",
              "-x!mutex_lock.txt", "-x!iptv_cache.json"
          )
          
          & 7z a -tzip $ZipName * @ExcludeArgs

      - name: Extract Release Notes
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -match '(?s)## \[[^\]]+\] - \d{4}-\d{2}-\d{2}\s*(.*?)(?=## \[[^\]]+\] - \d{4}-\d{2}-\d{2}|$)') {
              $notes = $matches[1].Trim()
              Set-Content -Path release_notes.txt -Value $notes -Encoding UTF8
          } else {
              Set-Content -Path release_notes.txt -Value "Otomatik sürüm notu bulunamadı." -Encoding UTF8
          }

      - name: Upload Windows Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          body_path: release_notes.txt

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y wget rsync libfuse2

      - name: Prepare AppDir Structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/ffmpeg
          mkdir -p AppDir/yt-dlp

      - name: Copy Project Files to AppDir
        run: |
          # Linux paketleme mantığına uygun olarak gerekli dosyaları kopyala
          rsync -a --exclude='.git' --exclude='0nogithub' --exclude='HaYTooLPlayer' --exclude='scratch' --exclude='backup' --exclude='logs' --exclude='screenshots' --exclude='releases' --exclude='*.WebView2' --exclude='EBWebView' --exclude='*.exe' --exclude='*.bat' --exclude='*.dll' --exclude='AppDir' . AppDir/

      - name: Download Node.js (Linux Binary)
        run: |
          wget https://nodejs.org/dist/v20.11.1/node-v20.11.1-linux-x64.tar.xz
          tar -xf node-v20.11.1-linux-x64.tar.xz
          cp node-v20.11.1-linux-x64/bin/node AppDir/usr/bin/node
          chmod +x AppDir/usr/bin/node

      - name: Download FFmpeg (Linux)
        run: |
          wget https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          find . -type f -name "ffmpeg" -exec cp {} AppDir/ffmpeg/ \;
          find . -type f -name "ffprobe" -exec cp {} AppDir/ffmpeg/ \;
          chmod +x AppDir/ffmpeg/ffmpeg AppDir/ffmpeg/ffprobe

      - name: Download yt-dlp Nightly (Linux)
        run: |
          wget https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -O AppDir/yt-dlp/yt-dlp
          chmod +x AppDir/yt-dlp/yt-dlp

      - name: Create AppRun Script
        run: |
          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="$HERE/usr/bin:$HERE/ffmpeg:$HERE/yt-dlp:$PATH"
          export APPDIR="$HERE"
          cd "$HERE"
          exec "$HERE/usr/bin/node" server.js
          EOF
          chmod +x AppDir/AppRun

      - name: Create Desktop Entry and Icon
        run: |
          cat << 'EOF' > AppDir/haytool.desktop
          [Desktop Entry]
          Type=Application
          Name=HaYTooL YouTube Downloader
          Exec=AppRun
          Icon=haytool
          Categories=AudioVideo;Utility;
          Terminal=true
          EOF
          cp public/logo.png AppDir/haytool.png || touch AppDir/haytool.png

      - name: Build AppImage
        run: |
          wget -c https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # AppImage'ı oluştur
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run -u "gh-releases-zsync|HaYToKoRaZ|haytool-youtube-download|latest|*AppImage.zsync" AppDir "${{ github.ref_name }}-HaYTooL-YD-$(date +%Y-%m-%d).AppImage"
          
          # appimagetool'un kendisini sil (Releases sekmesine yüklenmemesi için)
          rm appimagetool-x86_64.AppImage

      - name: Upload Linux Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.zsync
