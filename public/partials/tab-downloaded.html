              <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-main); cursor: pointer; user-select: none; margin: 0;">
                <input type="checkbox" id="downloaded-bulk-delete-select-all" onchange="toggleSelectAllDownloadedBulkDelete(this)" style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--primary);">
                <span id="lbl-dl-select-all">Tümünü Seç</span>
              </label>
              <span style="color: rgba(255,255,255,0.15); font-size: 0.9rem;">|</span>
              <span style="font-size: 0.9rem; color: var(--text-main);">
                <span id="lbl-dl-selected-count">Seçilen:</span> 
                <strong id="downloaded-bulk-delete-selected-count" style="color: var(--secondary); font-size: 1rem; font-family: var(--font-title);">0</strong>
              </span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <label style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; user-select: none; margin: 0; padding-right: 10px;">
                <input type="checkbox" id="downloaded-bulk-delete-files-checkbox" checked style="cursor: pointer; width: 14px; height: 14px; accent-color: var(--primary);">
                <span id="lbl-dl-also-delete-files">Diskteki Dosyaları da Sil</span>
              </label>
              <button type="button" class="btn btn-secondary btn-sm" onclick="cancelDownloadedBulkDeleteMode()" style="padding: 6px 14px; font-size: 0.8rem; border-radius: 8px;">İptal</button>
              <button type="button" class="btn btn-primary btn-sm" onclick="executeDownloadedBulkDelete()" style="background: var(--accent-red); border-color: var(--accent-red); padding: 6px 14px; font-size: 0.8rem; border-radius: 8px; font-weight: 600; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.2);">Seçilenleri Sil</button>
            </div>
          </div>

          <div class="history-grid" id="downloaded-grid">
            <!-- İndirilmiş video kartları JS ile buraya yüklenecek -->
          </div>
        </div>
      </section>
