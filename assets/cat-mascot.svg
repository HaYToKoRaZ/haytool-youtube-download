<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="catHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
    <linearGradient id="catEarInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA8A8" />
      <stop offset="100%" stop-color="#FF6666" />
    </linearGradient>
    <linearGradient id="catGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Arka Plan Işıltısı -->
  <circle cx="100" cy="105" r="75" fill="url(#catGlow)" filter="blur(10px)"/>

  <!-- Kulaklık Bandı (Gamer / YouTube Oynatıcı Kulaklığı) -->
  <path d="M 35 105 A 65 65 0 0 1 165 105" fill="none" stroke="#222222" stroke-width="12" stroke-linecap="round"/>
  <path d="M 35 105 A 65 65 0 0 1 165 105" fill="none" stroke="#FF0000" stroke-width="4" stroke-linecap="round"/>

  <!-- Kulaklar -->
  <!-- Sol Kulak -->
  <polygon points="35,100 55,25 90,80" fill="url(#catHeadGrad)" filter="url(#shadow)" stroke="#B30000" stroke-width="2"/>
  <polygon points="45,90 58,42 82,75" fill="url(#catEarInner)"/>

  <!-- Sağ Kulak -->
  <polygon points="165,100 145,25 110,80" fill="url(#catHeadGrad)" filter="url(#shadow)" stroke="#B30000" stroke-width="2"/>
  <polygon points="155,90 142,42 118,75" fill="url(#catEarInner)"/>

  <!-- Kedi Kafası -->
  <ellipse cx="100" cy="115" rx="68" ry="60" fill="url(#catHeadGrad)" filter="url(#shadow)"/>

  <!-- Kulaklık Yastıkları (Kırmızı YouTube Düğmesi Şeklinde) -->
  <rect x="22" y="88" width="18" height="34" rx="9" fill="#181818" stroke="#FF0000" stroke-width="2" filter="url(#shadow)"/>
  <rect x="160" y="88" width="18" height="34" rx="9" fill="#181818" stroke="#FF0000" stroke-width="2" filter="url(#shadow)"/>

  <!-- Alındaki Play Sembolü (YouTube Üçgeni) -->
  <polygon points="94,75 110,84 94,93" fill="#FFFFFF" opacity="0.95" filter="url(#shadow)"/>

  <!-- Sevimli Gözler -->
  <!-- Sol Göz (Büyük Parlak Anime Göz) -->
  <ellipse cx="72" cy="112" rx="13" ry="17" fill="#111111"/>
  <circle cx="68" cy="106" r="6" fill="#FFFFFF"/>
  <circle cx="76" cy="118" r="2.5" fill="#FFFFFF"/>
  <!-- Sağ Göz (Göz Kırpan Veya Parlak) -->
  <ellipse cx="128" cy="112" rx="13" ry="17" fill="#111111"/>
  <circle cx="124" cy="106" r="6" fill="#FFFFFF"/>
  <circle cx="132" cy="118" r="2.5" fill="#FFFFFF"/>

  <!-- Yanaklardaki Sevimli Allık -->
  <ellipse cx="56" cy="128" rx="9" ry="5" fill="#FFA5A5" opacity="0.75"/>
  <ellipse cx="144" cy="128" rx="9" ry="5" fill="#FFA5A5" opacity="0.75"/>

  <!-- Burun (Küçük Pembe Kalp/Üçgen) -->
  <polygon points="100,123 95,118 105,118" fill="#FFFFFF" rx="2"/>

  <!-- Ağız (Sevimli Kedi :3 Ağzı) -->
  <path d="M 94 125 Q 100 130 100 125 Q 100 130 106 125" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Bıyıklar -->
  <!-- Sol Bıyıklar -->
  <line x1="60" y1="122" x2="25" y2="116" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="128" x2="22" y2="130" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="134" x2="26" y2="142" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Sağ Bıyıklar -->
  <line x1="140" y1="122" x2="175" y2="116" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="142" y1="128" x2="178" y2="130" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="140" y1="134" x2="174" y2="142" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Ön Kedi Patileri (Alt Kısımda Ekrandan Bakan) -->
  <!-- Sol Pati -->
  <ellipse cx="75" cy="168" rx="16" ry="12" fill="#E60000" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="70" cy="166" r="3.5" fill="#FFA5A5"/>
  <circle cx="75" cy="163" r="3.5" fill="#FFA5A5"/>
  <circle cx="80" cy="166" r="3.5" fill="#FFA5A5"/>
  <ellipse cx="75" cy="172" rx="6" ry="4" fill="#FFA5A5"/>

  <!-- Sağ Pati (Pati Sallayan Pozisyon) -->
  <ellipse cx="125" cy="168" rx="16" ry="12" fill="#E60000" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="120" cy="166" r="3.5" fill="#FFA5A5"/>
  <circle cx="125" cy="163" r="3.5" fill="#FFA5A5"/>
  <circle cx="130" cy="166" r="3.5" fill="#FFA5A5"/>
  <ellipse cx="125" cy="172" rx="6" ry="4" fill="#FFA5A5"/>
</svg>
