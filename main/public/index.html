<!DOCTYPE html>

  <!-- Erken Hata Yakalayıcı: error-bridge.js yüklenene kadar hataları kuyruğa alır -->
  <script>
    (function () {
      window.__htErrQ = [];
      window.__htErr = function (message, stack) {
        try {
          window.__htErrQ.push({
            m: String(message == null ? '' : message).slice(0, 4000),
            s: String(stack == null ? '' : stack).slice(0, 4000),
            u: String(location.pathname + location.hash).slice(0, 300),
            t: Date.now()
          });
          if (window.__htErrQ.length > 60) window.__htErrQ.shift();
        } catch (e) {}
      };
      window.addEventListener('error', function (e) {
        if (e && e.message) {
          window.__htErr(e.message, (e.error && e.error.stack) || (e.filename ? e.filename + ':' + e.lineno : ''));
        } else if (e && e.target && e.target !== window && (e.target.src || e.target.href)) {
          var tUrl = e.target.src || e.target.href || '';
          var isHandledImg = e.target.tagName === 'IMG' && (e.target.hasAttribute('onerror') || typeof e.target.onerror === 'function');
          if (tUrl && !isHandledImg && !tUrl.endsWith('/downlist') && !tUrl.includes('/thumbnail') && !tUrl.includes('/avatar') && !tUrl.startsWith('data:')) {
            window.__htErr('Kaynak yüklenemedi: ' + tUrl);
          }
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        var msg = r && r.message ? r.message : String(r);
        if (msg && msg.includes('Permissions check failed')) return;
        window.__htErr('Yakalanmamış promise: ' + msg, r && r.stack);
      });
    })();
  </script>
  <link rel="icon" type="image/png" href="/logo.png">

  <script>
    (function() {
      try {
        var t = localStorage.getItem('haytool_theme');
        if (t && t !== 'dark') {
          document.body.classList.remove('light-theme', 'matrix-theme', 'discord-theme', 'youtube-theme');
          document.body.classList.add(t + '-theme');
        }
      } catch(e) {}
    })();
  </script>

        </div>
      </div>
